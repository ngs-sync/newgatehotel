<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Gates Hotel PMS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .ai-content p { margin-bottom: 0.75rem; }
        .ai-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 🛠️ 1. SETUP
        // ==========================================
        const SUPABASE_URL = 'https://wzammfnzptusiicwdaut.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Jk23sVPoYwengKLIjL78ww_Az4d7Tl-';
        const GEMINI_API_KEY = 'AIzaSyA92TBUTDqARe9mcVI7uTChuRGYe6vK9RY';
        
        const isConfigured = SUPABASE_URL.startsWith('http');
        const supabase = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const { useState, useEffect, useCallback } = React;

        const Icons = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Book: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
            Bed: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Logout: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Sparkles: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Edit: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        };

        // --- Toast Component ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [message, onClose]);

            if (!message) return null;
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-green-500';

            return (
                <div className={`fixed top-5 right-5 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg flex items-center z-[9999]`}>
                    <span>{message}</span>
                </div>
            );
        };

        // --- Login Screen ---
        const LoginScreen = ({ onLoginSuccess, showToast }) => {
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({ tenant_id: '', email: '', password: '' });

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('*, tenants(name)')
                        .eq('tenant_id', formData.tenant_id.toUpperCase())
                        .eq('email', formData.email)
                        .eq('password', formData.password)
                        .maybeSingle();

                    if (error) throw new Error("Terjadi kesalahan database.");
                    if (!data) throw new Error("Login gagal. Kode Hotel, Email, atau Password salah.");

                    showToast(`Selamat datang, ${data.full_name}!`, "success");
                    localStorage.setItem('hotel_session', JSON.stringify(data));
                    onLoginSuccess(data);
                } catch (err) {
                    showToast(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-blue-600">New Gates PMS</h1>
                            <p className="text-gray-500 mt-2">Sistem Manajemen Hotel Front Office</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Kode Hotel</label>
                                <input type="text" required className="w-full border p-3 rounded-lg uppercase" 
                                    placeholder="Cth: GATES-001" 
                                    value={formData.tenant_id}
                                    onChange={(e) => setFormData({...formData, tenant_id: e.target.value.trim()})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email Staf/Admin</label>
                                <input type="email" required className="w-full border p-3 rounded-lg" 
                                    placeholder="email@hotel.com"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value.trim()})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" required className="w-full border p-3 rounded-lg" 
                                    value={formData.password}
                                    onChange={(e) => setFormData({...formData, password: e.target.value})} />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors mt-2">
                                {loading ? 'Memeriksa...' : 'Masuk Sistem'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- AI Assistant ---
        const AIAssistantView = ({ showToast }) => {
            const [prompt, setPrompt] = useState('');
            const [response, setResponse] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAskAI = async (e) => {
                e.preventDefault();
                if (!GEMINI_API_KEY) {
                    showToast("API Key Gemini belum diatur!", "error");
                    return;
                }
                setLoading(true);
                try {
                    const systemPrompt = "Anda adalah AI Assistant cerdas untuk PMS. Jawablah secara profesional. Pertanyaan: " + prompt;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    setResponse(data.candidates[0].content.parts[0].text);
                    setPrompt('');
                } catch (err) {
                    showToast(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6 max-w-4xl">
                    <div className="flex items-center gap-3">
                        <div className="bg-purple-100 p-2 rounded-lg text-purple-700"><Icons.Sparkles /></div>
                        <h2 className="text-2xl font-bold text-gray-800">Hotel AI Assistant</h2>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[60vh]">
                        <div className="flex-1 p-6 flex flex-col">
                            <div className="flex-1 overflow-y-auto mb-4 bg-gray-50 rounded-xl p-4 border border-gray-100">
                                {!response && !loading && <div className="h-full flex items-center justify-center text-gray-400 text-sm text-center">Halo! Silakan tanya saya apa saja.</div>}
                                {loading && <div className="flex items-center justify-center text-purple-600 h-full font-medium">Sedang berpikir...</div>}
                                {response && !loading && (
                                    <div className="text-gray-800 text-sm leading-relaxed ai-content" 
                                         dangerouslySetInnerHTML={{ __html: response.replace(/\n/g, '<br/>') }}></div>
                                )}
                            </div>
                            <form onSubmit={handleAskAI} className="flex gap-2">
                                <input type="text" className="flex-1 border p-3 rounded-lg" placeholder="Tanya AI..." value={prompt} onChange={(e) => setPrompt(e.target.value)} required />
                                <button type="submit" disabled={loading} className="bg-purple-600 text-white px-6 font-bold py-3 rounded-lg">Tanya AI</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Dashboard ---
        const Dashboard = ({ tenantId, showToast }) => {
            const [stats, setStats] = useState({ rooms: 0, res: 0, rev: 0 });
            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const [resRooms, resRes] = await Promise.all([
                            supabase.from('rooms').select('id', { count: 'exact' }).eq('tenant_id', tenantId),
                            supabase.from('reservations').select('total_amount').eq('tenant_id', tenantId)
                        ]);
                        if (resRooms.error) throw resRooms.error;
                        if (resRes.error) throw resRes.error;
                        let totalRev = 0;
                        if(resRes.data) totalRev = resRes.data.reduce((sum, b) => sum + (Number(b.total_amount) || 0), 0);
                        setStats({ rooms: resRooms.count || 0, res: resRes.data?.length || 0, rev: totalRev });
                    } catch (e) {
                        showToast("Gagal memuat statistik: " + e.message, "error");
                    }
                };
                if(tenantId) fetchStats();
            }, [tenantId, showToast]);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Dashboard</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-blue-500">
                            <p className="text-gray-500 text-sm">Total Kamar</p><p className="text-3xl font-bold">{stats.rooms}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-green-500">
                            <p className="text-gray-500 text-sm">Reservasi</p><p className="text-3xl font-bold">{stats.res}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-purple-500">
                            <p className="text-gray-500 text-sm">Revenue</p><p className="text-3xl font-bold">Rp {stats.rev.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Rooms ---
        const RoomsView = ({ tenantId, showToast }) => {
            const [rooms, setRooms] = useState([]);
            useEffect(() => {
                const fetchRooms = async () => {
                    const { data, error } = await supabase.from('rooms').select('*').eq('tenant_id', tenantId).order('room_number');
                    if (error) showToast("Gagal memuat kamar: " + error.message, "error");
                    if (data) setRooms(data);
                };
                if(tenantId) fetchRooms();
            }, [tenantId, showToast]);
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Housekeeping</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        {rooms.map(r => (
                            <div key={r.id} className="bg-white p-4 rounded-xl shadow-sm text-center">
                                <span className="text-2xl font-bold">{r.room_number}</span>
                                <span className="block text-xs uppercase mt-2">{r.status}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Reservations ---
        const ReservationsView = ({ tenantId, showToast }) => {
            const [reservations, setReservations] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [form, setForm] = useState({ guest_name: '', check_in: '', check_out: '', total_amount: 0 });

            const fetchRes = async () => {
                const { data, error } = await supabase.from('reservations').select('*').eq('tenant_id', tenantId).order('created_at', { ascending: false });
                if (error) showToast("Gagal memuat reservasi: " + error.message, "error");
                if (data) setReservations(data);
            };
            useEffect(() => { if(tenantId) fetchRes(); }, [tenantId, showToast]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const { error } = await supabase.from('reservations').insert([{
                    tenant_id: tenantId, reservation_number: 'RES-' + Math.floor(Math.random() * 100000),
                    guest_name: form.guest_name, check_in: form.check_in, check_out: form.check_out, total_amount: form.total_amount, status: 'confirmed'
                }]);
                if (error) { showToast(error.message, "error"); }
                else { showToast("Berhasil!", "success"); setIsModalOpen(false); fetchRes(); }
            };

            const closeBtn = () => setIsModalOpen(false);
            const openBtn = () => setIsModalOpen(true);

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold">Front Office</h2>
                        <button onClick={openBtn} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2"><Icons.Plus /> Baru</button>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 border-b">
                                <tr><th className="p-4">No. Res</th><th className="p-4">Tamu</th><th className="p-4">Cek-in</th><th className="p-4">Status</th></tr>
                            </thead>
                            <tbody>{reservations.map(res => (
                                <tr key={res.id} className="border-b">
                                    <td className="p-4">{res.reservation_number}</td><td className="p-4">{res.guest_name}</td><td className="p-4">{res.check_in}</td>
                                    <td className="p-4"><span className="bg-blue-100 px-2 py-1 rounded text-xs">{res.status}</span></td>
                                </tr>
                            ))}</tbody>
                        </table>
                    </div>
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-lg p-6">
                                <div className="flex justify-between mb-4">
                                    <h3 className="text-xl font-bold">Reservasi Baru</h3>
                                    <button onClick={closeBtn}><Icons.Close /></button>
                                </div>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <input required className="w-full border p-2 rounded" placeholder="Nama Tamu" onChange={e=>setForm({...form, guest_name: e.target.value})} />
                                    <input required className="w-full border p-2 rounded" type="date" onChange={e=>setForm({...form, check_in: e.target.value})} />
                                    <input required className="w-full border p-2 rounded" type="date" onChange={e=>setForm({...form, check_out: e.target.value})} />
                                    <div className="flex justify-end gap-2"><button type="button" onClick={closeBtn}>Batal</button><button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded">Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Room Category ---
        const RoomCategorySetting = ({ tenantId, showToast }) => {
            const [categories, setCategories] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [form, setForm] = useState({ name: '', bed_type: '', total_rooms: '' });

            const fetchCats = async () => {
                const { data, error } = await supabase.from('room_categories').select('*').eq('tenant_id', tenantId).order('name');
                if (error) showToast("Gagal memuat kategori: " + error.message, "error");
                if (data) setCategories(data);
            };
            useEffect(() => { fetchCats(); }, []);

            const openAdd = () => { setEditingItem(null); setForm({ name: '', bed_type: '', total_rooms: '' }); setIsModalOpen(true); };
            const openEdit = (cat) => { setEditingItem(cat); setForm({ name: cat.name, bed_type: cat.bed_type, total_rooms: cat.total_rooms }); setIsModalOpen(true); };
            const closeBtn = () => setIsModalOpen(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    let res;
                    if (editingItem) {
                        res = await supabase.from('room_categories').update(form).eq('id', editingItem.id);
                    } else {
                        res = await supabase.from('room_categories').insert([{ ...form, tenant_id: tenantId }]);
                    }
                    if (res.error) throw res.error;
                    setIsModalOpen(false); fetchCats(); showToast("Berhasil simpan kategori!");
                } catch (err) { showToast("Gagal simpan kategori: " + err.message, "error"); }
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <h3 className="font-bold">Daftar Tipe Kamar</h3>
                        <button onClick={openAdd} className="bg-blue-600 text-white px-3 py-1 rounded text-sm flex items-center gap-1"><Icons.Plus /> Tambah</button>
                    </div>
                    <table className="w-full text-left">
                        <thead><tr className="bg-gray-50 border-b"><th>Tipe</th><th>Bed</th><th>Aksi</th></tr></thead>
                        <tbody>{categories.map(cat => (
                            <tr key={cat.id} className="border-b">
                                <td>{cat.name}</td><td>{cat.bed_type}</td>
                                <td className="space-x-2">
                                    <button onClick={() => openEdit(cat)} className="text-blue-600"><Icons.Edit /></button>
                                    <button onClick={async () => {
                                        if(confirm("Hapus?")) {
                                            const { error } = await supabase.from('room_categories').delete().eq('id', cat.id);
                                            if (error) showToast("Gagal hapus: " + error.message, "error");
                                            else { showToast("Kategori dihapus!"); fetchCats(); }
                                        }
                                    }} className="text-red-600"><Icons.Trash /></button>
                                </td>
                            </tr>
                        ))}</tbody>
                    </table>
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl p-6 w-full max-w-md">
                                <h3 className="font-bold mb-4">{editingItem ? 'Edit' : 'Tambah'} Tipe</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <input required className="w-full border p-2 rounded" placeholder="Nama" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} />
                                    <input required className="w-full border p-2 rounded" placeholder="Kasur" value={form.bed_type} onChange={e=>setForm({...form, bed_type: e.target.value})} />
                                    <input required type="number" className="w-full border p-2 rounded" placeholder="Jumlah" value={form.total_rooms} onChange={e=>setForm({...form, total_rooms: e.target.value})} />
                                    <div className="flex justify-end gap-2"><button type="button" onClick={closeBtn}>Batal</button><button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded">Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Room Numbers ---
        const RoomNumberSetting = ({ tenantId, showToast }) => {
            const [rooms, setRooms] = useState([]);
            const [categories, setCategories] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [selectedCategoryId, setSelectedCategoryId] = useState('');
            const [bulkRows, setBulkRows] = useState([{ num: '', floor: '', building: '' }]);
            const [editForm, setEditForm] = useState({ room_number: '', category_id: '', floor: '', building: '' });

            const fetchData = async () => {
                const [r1, r2] = await Promise.all([
                    supabase.from('rooms').select('*, room_categories(name)').eq('tenant_id', tenantId).order('room_number'),
                    supabase.from('room_categories').select('*').eq('tenant_id', tenantId).order('name')
                ]);
                if (r1.error) showToast("Gagal memuat kamar: " + r1.error.message, "error");
                if (r2.error) showToast("Gagal memuat kategori: " + r2.error.message, "error");
                if (r1.data) setRooms(r1.data);
                if (r2.data) setCategories(r2.data);
            };
            useEffect(() => { fetchData(); }, []);

            const openAdd = () => { setEditingItem(null); setSelectedCategoryId(''); setBulkRows([{ num: '', floor: '', building: '' }]); setIsModalOpen(true); };
            const openEdit = (r) => { setEditingItem(r); setEditForm({ room_number: r.room_number, category_id: r.category_id, floor: r.floor || '', building: r.building || '' }); setIsModalOpen(true); };
            const closeBtn = () => setIsModalOpen(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    let res;
                    if (editingItem) {
                        res = await supabase.from('rooms').update(editForm).eq('id', editingItem.id);
                    } else {
                        const payload = bulkRows.filter(r=>r.num).map(r=>({
                            room_number: r.num,
                            floor: r.floor,
                            building: r.building,
                            tenant_id: tenantId,
                            category_id: selectedCategoryId,
                            status: 'available'
                        }));
                        if (payload.length) {
                            res = await supabase.from('rooms').insert(payload);
                        } else {
                            showToast("Tidak ada data kamar untuk disimpan", "error");
                            return;
                        }
                    }
                    if (res.error) throw res.error;
                    setIsModalOpen(false); fetchData(); showToast("Berhasil simpan data kamar!");
                } catch (err) { showToast("Gagal simpan: " + err.message, "error"); }
            };

            const addRow = () => setBulkRows([...bulkRows, { num: '', floor: '', building: '' }]);
            const removeRow = (index) => {
                if (bulkRows.length > 1) {
                    setBulkRows(bulkRows.filter((_, i) => i !== index));
                }
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <h3 className="font-bold">Nomor Kamar</h3>
                        <button onClick={openAdd} className="bg-blue-600 text-white px-3 py-1 rounded text-sm"><Icons.Plus /> Tambah Bulk</button>
                    </div>
                    <table className="w-full text-left">
                        <thead><tr className="bg-gray-50 border-b"><th>No</th><th>Tipe</th><th>Gedung/Lantai</th><th>Aksi</th></tr></thead>
                        <tbody>{rooms.map(r => (
                            <tr key={r.id} className="border-b">
                                <td>{r.room_number}</td><td>{r.room_categories?.name}</td>
                                <td>{r.building || '-'}{r.floor ? ` / Lt.${r.floor}` : ''}</td>
                                <td className="space-x-2">
                                    <button onClick={() => openEdit(r)} className="text-blue-600"><Icons.Edit /></button>
                                    <button onClick={async () => {
                                        if(confirm("Hapus?")) {
                                            const { error } = await supabase.from('rooms').delete().eq('id', r.id);
                                            if (error) showToast("Gagal hapus: " + error.message, "error");
                                            else { showToast("Kamar dihapus!"); fetchData(); }
                                        }
                                    }} className="text-red-600"><Icons.Trash /></button>
                                </td>
                            </tr>
                        ))}</tbody>
                    </table>
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">{editingItem ? 'Edit' : 'Tambah Bulk'}</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    {editingItem ? (
                                        <div className="space-y-4">
                                            <select required value={editForm.category_id} onChange={e=>setEditForm({...editForm, category_id: e.target.value})} className="w-full border p-2 rounded">
                                                <option value="">Pilih Tipe</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                            <input required placeholder="No Kamar" className="w-full border p-2 rounded" value={editForm.room_number} onChange={e=>setEditForm({...editForm, room_number: e.target.value})} />
                                            <input placeholder="Lantai" className="w-full border p-2 rounded" value={editForm.floor} onChange={e=>setEditForm({...editForm, floor: e.target.value})} />
                                            <input placeholder="Gedung" className="w-full border p-2 rounded" value={editForm.building} onChange={e=>setEditForm({...editForm, building: e.target.value})} />
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            <select required value={selectedCategoryId} onChange={e=>setSelectedCategoryId(e.target.value)} className="w-full border p-2 rounded">
                                                <option value="">-- Pilih Tipe Kamar --</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                            <div className="space-y-2">
                                                {bulkRows.map((row, i) => (
                                                    <div key={i} className="flex gap-2 items-center">
                                                        <input required placeholder="No" className="w-20 border p-2 rounded" value={row.num} onChange={e=>setBulkRows(bulkRows.map((r,idx)=>idx===i?{...r,num:e.target.value}:r))} />
                                                        <input placeholder="Lantai" className="w-20 border p-2 rounded" value={row.floor} onChange={e=>setBulkRows(bulkRows.map((r,idx)=>idx===i?{...r,floor:e.target.value}:r))} />
                                                        <input placeholder="Gedung" className="flex-1 border p-2 rounded" value={row.building} onChange={e=>setBulkRows(bulkRows.map((r,idx)=>idx===i?{...r,building:e.target.value}:r))} />
                                                        <button type="button" onClick={() => removeRow(i)} className="text-red-500 p-2"><Icons.Trash /></button>
                                                    </div>
                                                ))}
                                            </div>
                                            <button type="button" onClick={addRow} className="text-blue-600">+ Baris</button>
                                        </div>
                                    )}
                                    <div className="flex justify-end gap-2 pt-4 border-t"><button type="button" onClick={closeBtn}>Batal</button><button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded">Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Segmentation Setting ---
        const SegmentationSetting = ({ tenantId, showToast }) => {
            const [groups, setGroups] = useState([]);
            const [codes, setCodes] = useState([]);
            const [selectedGroupId, setSelectedGroupId] = useState(null);
            const [isGroupModalOpen, setIsGroupModalOpen] = useState(false);
            const [isCodeModalOpen, setIsCodeModalOpen] = useState(false);
            const [editingGroup, setEditingGroup] = useState(null);
            const [editingCode, setEditingCode] = useState(null);
            const [groupForm, setGroupForm] = useState({ description: '' });
            const [codeForm, setCodeForm] = useState({ group_id: '', code: '', description: '' });

            const fetchData = useCallback(async () => {
                try {
                    const [resG, resC] = await Promise.all([
                        supabase.from('segmentation_groups').select('*').eq('tenant_id', tenantId).order('id'),
                        supabase.from('segmentation_codes').select('*').eq('tenant_id', tenantId).order('id')
                    ]);
                    if (resG.error) throw resG.error;
                    if (resC.error) throw resC.error;
                    if (resG.data) setGroups(resG.data);
                    if (resC.data) setCodes(resC.data);
                } catch (e) {
                    console.error(e);
                    showToast("Gagal memuat data: " + e.message, "error");
                }
            }, [tenantId, showToast]);

            useEffect(() => { fetchData(); }, [fetchData]);

            const handleGroupSubmit = async (e) => {
                e.preventDefault();
                try {
                    let res;
                    if (editingGroup) {
                        res = await supabase.from('segmentation_groups').update(groupForm).eq('id', editingGroup.id);
                    } else {
                        res = await supabase.from('segmentation_groups').insert([{ ...groupForm, tenant_id: tenantId }]);
                    }
                    if (res.error) throw res.error;
                    setIsGroupModalOpen(false); fetchData(); showToast("Berhasil simpan grup!");
                } catch (err) { showToast("Gagal simpan grup: " + err.message, "error"); }
            };

            const handleCodeSubmit = async (e) => {
                e.preventDefault();
                try {
                    let res;
                    if (editingCode) {
                        res = await supabase.from('segmentation_codes').update(codeForm).eq('id', editingCode.id);
                    } else {
                        res = await supabase.from('segmentation_codes').insert([{ ...codeForm, tenant_id: tenantId }]);
                    }
                    if (res.error) throw res.error;
                    setIsCodeModalOpen(false); fetchData(); showToast("Berhasil simpan kode!");
                } catch (err) { showToast("Gagal simpan kode: " + err.message, "error"); }
            };

            const filteredCodes = selectedGroupId ? codes.filter(c => c.group_id === selectedGroupId) : codes;

            return (
                <div className="space-y-8">
                    <div className="space-y-4">
                        <div className="flex justify-between items-center">
                            <h3 className="font-bold text-lg text-gray-800">Main Group Segments</h3>
                            <button onClick={() => { setEditingGroup(null); setGroupForm({description:''}); setIsGroupModalOpen(true); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow-sm hover:bg-blue-700 transition-colors">
                                <Icons.Plus /> Tambah Grup
                            </button>
                        </div>
                        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th className="p-4 w-16 text-gray-500 font-medium">No</th>
                                        <th className="p-4 text-gray-500 font-medium">Description</th>
                                        <th className="p-4 w-32 text-right text-gray-500 font-medium">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {groups.map((g, idx) => (
                                        <tr key={g.id} className={`hover:bg-blue-50/50 cursor-pointer transition-colors ${selectedGroupId === g.id ? 'bg-blue-50 border-l-4 border-l-blue-600' : ''}`} onClick={() => setSelectedGroupId(g.id)}>
                                            <td className="p-4 text-gray-600">{idx + 1}</td>
                                            <td className="p-4 font-semibold text-gray-700 uppercase">{g.description}</td>
                                            <td className="p-4 text-right space-x-3" onClick={e => e.stopPropagation()}>
                                                <button onClick={() => { setEditingGroup(g); setGroupForm({description: g.description}); setIsGroupModalOpen(true); }} className="text-blue-600 hover:text-blue-800"><Icons.Edit /></button>
                                                <button onClick={async () => {
                                                    if(confirm("Hapus grup ini?")) {
                                                        const { error } = await supabase.from('segmentation_groups').delete().eq('id', g.id);
                                                        if (error) showToast("Gagal hapus grup: " + error.message, "error");
                                                        else { showToast("Grup dihapus!"); fetchData(); }
                                                    }
                                                }} className="text-red-500 hover:text-red-700"><Icons.Trash /></button>
                                            </td>
                                        </tr>
                                    ))}
                                    {groups.length === 0 && <tr><td colSpan="3" className="p-12 text-center text-gray-400 italic">Belum ada data Main Group.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-lg text-gray-800">Segment Code Setup</h3>
                                {selectedGroupId && <p className="text-sm text-blue-600 font-medium">Filter: {groups.find(g=>g.id === selectedGroupId)?.description}</p>}
                            </div>
                            <div className="flex gap-3">
                                {selectedGroupId && <button onClick={() => setSelectedGroupId(null)} className="text-sm text-gray-500 hover:text-blue-600 font-medium transition-colors">Tampilkan Semua</button>}
                                <button onClick={() => { setEditingCode(null); setCodeForm({group_id: selectedGroupId || '', code: '', description: ''}); setIsCodeModalOpen(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow-sm hover:bg-indigo-700 transition-colors">
                                    <Icons.Plus /> Tambah Segment Code
                                </button>
                            </div>
                        </div>
                        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th className="p-4 w-16 text-gray-500 font-medium">No</th>
                                        <th className="p-4 w-40 text-gray-500 font-medium">Main Group</th>
                                        <th className="p-4 w-32 text-gray-500 font-medium">Code</th>
                                        <th className="p-4 text-gray-500 font-medium">Description</th>
                                        <th className="p-4 w-24 text-right text-gray-500 font-medium">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {filteredCodes.map((c, idx) => (
                                        <tr key={c.id} className="hover:bg-gray-50 transition-colors">
                                            <td className="p-4 text-gray-600">{idx + 1}</td>
                                            <td className="p-4 text-gray-600 uppercase text-xs font-medium">{groups.find(g=>g.id === c.group_id)?.description || '-'}</td>
                                            <td className="p-4 font-bold text-indigo-600">{c.code}</td>
                                            <td className="p-4 text-gray-700">{c.description}</td>
                                            <td className="p-4 text-right space-x-3">
                                                <button onClick={() => { setEditingCode(c); setCodeForm({group_id: c.group_id, code: c.code, description: c.description}); setIsCodeModalOpen(true); }} className="text-blue-600 hover:text-blue-800"><Icons.Edit /></button>
                                                <button onClick={async () => {
                                                    if(confirm("Hapus kode ini?")) {
                                                        const { error } = await supabase.from('segmentation_codes').delete().eq('id', c.id);
                                                        if (error) showToast("Gagal hapus kode: " + error.message, "error");
                                                        else { showToast("Kode dihapus!"); fetchData(); }
                                                    }
                                                }} className="text-red-500 hover:text-red-700"><Icons.Trash /></button>
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredCodes.length === 0 && <tr><td colSpan="5" className="p-12 text-center text-gray-400 italic">Klik pada Main Group di atas atau tambah kode baru.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {isGroupModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                            <div className="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl animate-in fade-in zoom-in duration-200">
                                <h3 className="text-xl font-bold text-gray-800 mb-6">{editingGroup ? 'Edit' : 'Tambah'} Main Group</h3>
                                <form onSubmit={handleGroupSubmit} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                                        <input required className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all uppercase" placeholder="MISAL: CORPORATE" value={groupForm.description} onChange={e=>setGroupForm({description: e.target.value})} />
                                    </div>
                                    <div className="flex justify-end gap-3 pt-4">
                                        <button type="button" onClick={() => setIsGroupModalOpen(false)} className="px-5 py-2.5 text-gray-500 font-medium hover:text-gray-700 transition-colors">Batal</button>
                                        <button type="submit" className="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">Simpan Grup</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isCodeModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                            <div className="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl animate-in fade-in zoom-in duration-200">
                                <h3 className="text-xl font-bold text-gray-800 mb-6">{editingCode ? 'Edit' : 'Tambah'} Segment Code</h3>
                                <form onSubmit={handleCodeSubmit} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Main Group</label>
                                        <select required className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" value={codeForm.group_id} onChange={e=>setCodeForm({...codeForm, group_id: e.target.value})}>
                                            <option value="">-- Pilih Group --</option>
                                            {groups.map(g => <option key={g.id} value={g.id}>{g.description}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Segment Code</label>
                                        <input required className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all uppercase" placeholder="MISAL: GOFI" value={codeForm.code} onChange={e=>setCodeForm({...codeForm, code: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                                        <input required className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="MISAL: GOVERNMENT FIT" value={codeForm.description} onChange={e=>setCodeForm({...codeForm, description: e.target.value})} />
                                    </div>
                                    <div className="flex justify-end gap-3 pt-4">
                                        <button type="button" onClick={() => setIsCodeModalOpen(false)} className="px-5 py-2.5 text-gray-500 font-medium hover:text-gray-700 transition-colors">Batal</button>
                                        <button type="submit" className="bg-indigo-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all">Simpan Kode</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Hotel Config Main View ---
        const HotelConfigView = ({ session, showToast }) => {
            const [activeTab, setActiveTab] = useState('room_category');
            const tabs = [
                { id: 'room_category', label: 'Room Category' },
                { id: 'room_number', label: 'Room Number' },
                { id: 'segmentation', label: 'Segmentation' },
                { id: 'rate', label: 'Rate Structure' },
                { id: 'user', label: 'User Config' }
            ];

            return (
                <div className="space-y-6">
                    <div className="flex items-center gap-3">
                        <div className="bg-blue-100 p-2 rounded-lg text-blue-700"><Icons.Settings /></div>
                        <h2 className="text-2xl font-bold">Configuration</h2>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="flex border-b overflow-x-auto">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)}
                                    className={`px-6 py-4 text-sm font-medium whitespace-nowrap transition-colors ${activeTab === t.id ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>{t.label}</button>
                            ))}
                        </div>
                        <div className="p-6">
                            {activeTab === 'room_category' && <RoomCategorySetting tenantId={session.tenant_id} showToast={showToast} />}
                            {activeTab === 'room_number' && <RoomNumberSetting tenantId={session.tenant_id} showToast={showToast} />}
                            {activeTab === 'segmentation' && <SegmentationSetting tenantId={session.tenant_id} showToast={showToast} />}
                            {!['room_category', 'room_number', 'segmentation'].includes(activeTab) && <div className="py-20 text-center text-gray-500">Fitur sedang dikembangkan.</div>}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [session, setSession] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState({ message: '', type: '' });

            const showToast = useCallback((message, type = 'success') => setToast({ message, type }), []);
            const clearToast = useCallback(() => setToast({ message: '', type: '' }), []);

            useEffect(() => {
                const s = localStorage.getItem('hotel_session');
                if (s) setSession(JSON.parse(s));
            }, []);

            if (!session) return <LoginScreen onLoginSuccess={setSession} showToast={showToast} />;

            const handleLogout = () => { localStorage.removeItem('hotel_session'); setSession(null); };
            const nav = [
                { id: 'dashboard', l: 'Dashboard', i: <Icons.Home /> },
                { id: 'reservations', l: 'Front Office', i: <Icons.Book /> },
                { id: 'rooms', l: 'Housekeeping', i: <Icons.Bed /> },
                { id: 'ai', l: 'AI Assistant', i: <Icons.Sparkles /> }
            ];
            if (session.role === 'hotel_admin') nav.push({ id: 'config', l: 'Config', i: <Icons.Settings /> });

            return (
                <div className="flex h-screen bg-gray-100 font-sans">
                    <div className="w-64 bg-white border-r flex flex-col hidden md:flex">
                        <div className="p-6 border-b font-bold text-blue-700 truncate">{session.tenants?.name || session.tenant_id}</div>
                        <nav className="flex-1 p-4 space-y-2">
                            {nav.map(n => (
                                <button key={n.id} onClick={() => setCurrentView(n.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${currentView === n.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-gray-600'}`}>{n.i} {n.l}</button>
                            ))}
                        </nav>
                        <div className="p-4 border-t"><button onClick={handleLogout} className="w-full text-red-600 flex items-center gap-2"><Icons.Logout /> Keluar</button></div>
                    </div>
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {currentView === 'dashboard' && <Dashboard tenantId={session.tenant_id} showToast={showToast} />}
                            {currentView === 'reservations' && <ReservationsView tenantId={session.tenant_id} showToast={showToast} />}
                            {currentView === 'rooms' && <RoomsView tenantId={session.tenant_id} showToast={showToast} />}
                            {currentView === 'ai' && <AIAssistantView showToast={showToast} />}
                            {currentView === 'config' && <HotelConfigView session={session} showToast={showToast} />}
                        </main>
                    </div>
                    <Toast message={toast.message} type={toast.type} onClose={clearToast} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
