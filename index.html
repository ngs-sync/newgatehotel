<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Gates Hotel PMS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        /* Style untuk format output AI */
        .ai-content p { margin-bottom: 0.75rem; }
        .ai-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 🛠️ 1. SETUP SUPABASE & GEMINI API
        // ==========================================
        const SUPABASE_URL = 'https://wzammfnzptusiicwdaut.supabase.co>>';
        const SUPABASE_ANON_KEY = 'sb_publishable_Jk23sVPoYwengKLIjL78ww_Az4d7Tl-';
        const GEMINI_API_KEY = 'AIzaSyA92TBUTDqARe9mcVI7uTChuRGYe6vK9RY'; // Masukkan API Key Gemini Kamu Di Sini
        
        const isConfigured = SUPABASE_URL.startsWith('http');
        const supabase = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const { useState, useEffect } = React;

        // ==========================================
        // 🧩 2. KOMPONEN UI REUSABLE
        // ==========================================
        const Icons = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Book: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
            Bed: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Logout: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Sparkles: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [message]);
            if (!message) return null;
            const bg = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            return (
                <div className={`fixed top-5 right-5 ${bg} text-white px-6 py-3 rounded-lg shadow-lg flex items-center z-50`}>
                    <span>{message}</span>
                </div>
            );
        };

        // ==========================================
        // 🔐 3. HALAMAN LOGIN KLIEN
        // ==========================================
        const LoginScreen = ({ onLoginSuccess, showToast }) => {
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({ tenant_id: '', email: '', password: '' });

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    // MENGGUNAKAN maybeSingle() UNTUK MENCEGAH ERROR 406 JIKA KOSONG
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('*, tenants(name)')
                        .eq('tenant_id', formData.tenant_id.toUpperCase())
                        .eq('email', formData.email)
                        .eq('password', formData.password)
                        .maybeSingle();

                    if (error) {
                        throw new Error("Terjadi kesalahan database. Pastikan SQL Bypass RLS sudah dijalankan.");
                    }

                    if (!data) {
                        throw new Error("Login gagal. Kode Hotel, Email, atau Password salah.");
                    }

                    showToast(`Selamat datang, ${data.full_name}!`, "success");
                    localStorage.setItem('hotel_session', JSON.stringify(data));
                    onLoginSuccess(data);

                } catch (error) {
                    showToast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-blue-600">New Gates PMS</h1>
                            <p className="text-gray-500 mt-2">Sistem Manajemen Hotel Front Office</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Kode Hotel</label>
                                <input type="text" required className="w-full border p-3 rounded-lg uppercase" 
                                    placeholder="Cth: GATES-001" 
                                    value={formData.tenant_id} onChange={(e) => setFormData({...formData, tenant_id: e.target.value.trim()})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email Staf/Admin</label>
                                <input type="email" required className="w-full border p-3 rounded-lg" 
                                    placeholder="email@hotel.com"
                                    value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value.trim()})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" required className="w-full border p-3 rounded-lg" 
                                    value={formData.password} onChange={(e) => setFormData({...formData, password: e.target.value})} />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors mt-2">
                                {loading ? 'Memeriksa...' : 'Masuk Sistem'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🤖 4. AI ASSISTANT COMPONENT (GEMINI API)
        // ==========================================
        const AIAssistantView = ({ showToast }) => {
            const [prompt, setPrompt] = useState('');
            const [response, setResponse] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAskAI = async (e) => {
                e.preventDefault();
                if (!GEMINI_API_KEY || GEMINI_API_KEY.includes('<<GANTI_DI_SINI')) {
                    showToast("API Key Gemini belum diatur di dalam kode!", "error");
                    return;
                }

                setLoading(true);
                try {
                    // Konteks prompt agar Gemini bertindak sebagai pakar perhotelan
                    const systemPrompt = "Anda adalah AI Assistant cerdas untuk sistem Hotel Property Management System (PMS). Tugas Anda membantu resepsionis atau manajer hotel menyusun email, membalas komplain tamu, atau memberikan panduan operasional. Jawablah secara profesional dan ringkas. Pertanyaan dari staf hotel: " + prompt;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemPrompt }] }]
                        })
                    });

                    const data = await res.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    // Ambil teks dari response Gemini API
                    const aiText = data.candidates[0].content.parts[0].text;
                    // Format newline sederhana ke HTML br
                    setResponse(aiText);
                    setPrompt('');

                } catch (error) {
                    showToast(`Error AI: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6 max-w-4xl">
                    <div className="flex items-center gap-3">
                        <div className="bg-purple-100 p-2 rounded-lg text-purple-700"><Icons.Sparkles /></div>
                        <h2 className="text-2xl font-bold text-gray-800">Hotel AI Assistant</h2>
                    </div>
                    <p className="text-gray-600">Didukung oleh Google Gemini LLM. Minta AI untuk membantu membuat draf email tamu, menerjemahkan bahasa, atau memberikan ide penanganan komplain.</p>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col md:flex-row h-[60vh]">
                        {/* Area Chat */}
                        <div className="flex-1 p-6 flex flex-col border-r border-gray-100">
                            <div className="flex-1 overflow-y-auto mb-4 bg-gray-50 rounded-xl p-4 border border-gray-100">
                                {!response && !loading && (
                                    <div className="h-full flex items-center justify-center text-gray-400 text-sm text-center">
                                        Halo! Saya asisten AI Hotel Anda.<br/>Ketik permintaan Anda di bawah ini.
                                    </div>
                                )}
                                {loading && (
                                    <div className="flex items-center justify-center text-purple-600 h-full font-medium">
                                        <Icons.Sparkles className="animate-spin mr-2" /> Gemini sedang berpikir...
                                    </div>
                                )}
                                {response && !loading && (
                                    <div className="text-gray-800 text-sm leading-relaxed ai-content" 
                                         dangerouslySetInnerHTML={{ __html: response.replace(/\n/g, '<br/>') }} />
                                )}
                            </div>
                            <form onSubmit={handleAskAI} className="flex gap-2">
                                <input 
                                    type="text" 
                                    className="flex-1 border p-3 rounded-lg focus:ring-2 focus:ring-purple-300 focus:border-purple-500" 
                                    placeholder="Cth: Buatkan draf email sopan untuk tamu yang telat check-out..." 
                                    value={prompt} 
                                    onChange={(e) => setPrompt(e.target.value)} 
                                    required 
                                />
                                <button type="submit" disabled={loading} className="bg-purple-600 hover:bg-purple-700 text-white px-6 font-bold py-3 rounded-lg transition-colors flex items-center gap-2">
                                    Tanya AI
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 📊 5. DASHBOARD COMPONENT
        // ==========================================
        const Dashboard = ({ tenantId, showToast }) => {
            const [stats, setStats] = useState({ rooms: 0, reservations: 0, revenue: 0 });

            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const [resRooms, resBookings] = await Promise.all([
                            supabase.from('rooms').select('id', { count: 'exact' }).eq('tenant_id', tenantId),
                            supabase.from('reservations').select('total_amount').eq('tenant_id', tenantId)
                        ]);
                        
                        let totalRev = 0;
                        if(resBookings.data) totalRev = resBookings.data.reduce((sum, b) => sum + (Number(b.total_amount) || 0), 0);
                        
                        setStats({ rooms: resRooms.count || 0, reservations: resBookings.data?.length || 0, revenue: totalRev });
                    } catch (error) {
                        // Silent error untuk dashboard agar tidak spam toast
                    }
                };
                if(tenantId) fetchStats();
            }, [tenantId]);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Ringkasan Hari Ini</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                            <p className="text-gray-500 text-sm">Total Kamar</p><p className="text-3xl font-bold text-gray-800">{stats.rooms}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                            <p className="text-gray-500 text-sm">Reservasi Terdaftar</p><p className="text-3xl font-bold text-gray-800">{stats.reservations}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-purple-500">
                            <p className="text-gray-500 text-sm">Estimasi Pendapatan</p><p className="text-3xl font-bold text-gray-800">Rp {stats.revenue.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🛏️ 6. HOUSEKEEPING / ROOMS COMPONENT
        // ==========================================
        const RoomsView = ({ tenantId, showToast }) => {
            const [rooms, setRooms] = useState([]);
            useEffect(() => {
                const fetchRooms = async () => {
                    const { data } = await supabase.from('rooms').select(`*, room_types(name)`).eq('tenant_id', tenantId).order('room_number');
                    if (data) setRooms(data);
                };
                if(tenantId) fetchRooms();
            }, [tenantId]);

            const getStatusColor = (status) => {
                switch(status) {
                    case 'available': return 'bg-green-100 text-green-800';
                    case 'occupied': return 'bg-red-100 text-red-800';
                    case 'dirty': return 'bg-yellow-100 text-yellow-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Status Kamar</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        {rooms.map(room => (
                            <div key={room.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center justify-center h-32 hover:shadow-md transition">
                                <span className="text-2xl font-bold text-gray-800">{room.room_number}</span>
                                <span className="text-xs text-gray-500 mt-1">{room.room_types?.name}</span>
                                <span className={`mt-2 px-3 py-1 rounded-full text-xs font-semibold uppercase ${getStatusColor(room.status)}`}>{room.status}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 📝 7. RESERVASI COMPONENT
        // ==========================================
        const ReservationsView = ({ tenantId, showToast }) => {
            const [reservations, setReservations] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [loading, setLoading] = useState(false);
            const [form, setForm] = useState({ guest_name: '', check_in: '', check_out: '', total_amount: 0 });

            const fetchRes = async () => {
                const { data } = await supabase.from('reservations').select('*').eq('tenant_id', tenantId).order('created_at', { ascending: false });
                if (data) setReservations(data);
            };

            useEffect(() => { if(tenantId) fetchRes(); }, [tenantId]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { error } = await supabase.from('reservations').insert([{
                        tenant_id: tenantId, reservation_number: 'RES-' + Math.floor(Math.random() * 100000),
                        guest_name: form.guest_name, check_in: form.check_in, check_out: form.check_out, total_amount: form.total_amount, status: 'confirmed'
                    }]);
                    if (error) throw error;
                    showToast("Reservasi berhasil dibuat!", "success");
                    setIsModalOpen(false); fetchRes(); 
                } catch (error) {
                    showToast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Daftar Reservasi</h2>
                        <button onClick={() => setIsModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2"><Icons.Plus /> Reservasi Baru</button>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-50 border-b border-gray-100">
                                    <th className="p-4 text-sm font-semibold text-gray-600">No. Res</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Nama Tamu</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Cek-in</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {reservations.map(res => (
                                    <tr key={res.id} className="border-b border-gray-50 hover:bg-gray-50">
                                        <td className="p-4 font-mono text-sm">{res.reservation_number}</td>
                                        <td className="p-4 font-medium">{res.guest_name}</td>
                                        <td className="p-4 text-gray-600">{res.check_in}</td>
                                        <td className="p-4"><span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full uppercase font-semibold">{res.status}</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h3 className="text-xl font-bold text-gray-800">Reservasi Baru</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                                </div>
                                <div className="p-6">
                                    <form id="resForm" onSubmit={handleSubmit} className="space-y-4">
                                        <div><label className="block text-xs text-gray-500 mb-1">Nama Tamu *</label><input required className="w-full border p-2 rounded" type="text" onChange={e=>setForm({...form, guest_name: e.target.value})} /></div>
                                        <div><label className="block text-xs text-gray-500 mb-1">Tanggal Check-In *</label><input required className="w-full border p-2 rounded" type="date" onChange={e=>setForm({...form, check_in: e.target.value})} /></div>
                                        <div><label className="block text-xs text-gray-500 mb-1">Tanggal Check-Out *</label><input required className="w-full border p-2 rounded" type="date" onChange={e=>setForm({...form, check_out: e.target.value})} /></div>
                                        <div><label className="block text-xs text-gray-500 mb-1">Total Harga (Rp)</label><input className="w-full border p-2 rounded" type="number" onChange={e=>setForm({...form, total_amount: e.target.value})} /></div>
                                    </form>
                                </div>
                                <div className="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl">
                                    <button onClick={() => setIsModalOpen(false)} type="button" className="px-5 py-2 text-gray-600 bg-white border rounded-lg hover:bg-gray-100">Batal</button>
                                    <button form="resForm" type="submit" disabled={loading} className="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 🏗️ 8. STRUKTUR UTAMA APLIKASI (APP)
        // ==========================================
        const App = () => {
            const [session, setSession] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState({ message: '', type: '' });

            const showToast = (message, type = 'success') => setToast({ message, type });

            useEffect(() => {
                const savedSession = localStorage.getItem('hotel_session');
                if (savedSession) setSession(JSON.parse(savedSession));
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('hotel_session');
                setSession(null);
            };

            if (!isConfigured) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100">
                        <div className="bg-white p-8 rounded-xl text-center border-t-4 border-yellow-500">
                            <h1 className="text-xl font-bold">Setup Diperlukan</h1>
                            <p className="text-gray-500">Masukkan URL dan API Key Supabase.</p>
                        </div>
                    </div>
                );
            }

            if (!session) return <LoginScreen onLoginSuccess={setSession} showToast={showToast} />;

            const tenantId = session.tenant_id;
            const hotelName = session.tenants?.name || tenantId;

            // Navigasi dengan tambahan Menu AI
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <Icons.Home /> },
                { id: 'reservations', label: 'Front Office', icon: <Icons.Book /> },
                { id: 'rooms', label: 'Housekeeping', icon: <Icons.Bed /> },
                { id: 'ai_assistant', label: 'AI Assistant', icon: <Icons.Sparkles /> },
            ];

            return (
                <div className="flex h-screen bg-gray-100 font-sans">
                    <div className="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 shadow-sm">
                        <div className="p-6 border-b border-gray-100">
                            <h1 className="text-xl font-bold text-blue-700 truncate">{hotelName}</h1>
                            <p className="text-xs text-gray-500 mt-1 uppercase font-semibold">[{tenantId}]</p>
                            <p className="text-xs text-gray-400 mt-2 truncate">Halo, {session.full_name}</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${currentView === item.id ? (item.id === 'ai_assistant' ? 'bg-purple-50 text-purple-700 font-semibold' : 'bg-blue-50 text-blue-700 font-semibold') : 'text-gray-600 hover:bg-gray-50'}`}>
                                    {item.icon} {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-100">
                            <button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                                <Icons.Logout /> Keluar
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="bg-white md:hidden p-4 border-b border-gray-200 flex justify-between items-center shadow-sm z-10">
                            <h1 className="text-lg font-bold text-blue-700 truncate max-w-[200px]">{hotelName}</h1>
                            <button onClick={handleLogout} className="text-red-500"><Icons.Logout /></button>
                        </header>
                        
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {currentView === 'dashboard' && <Dashboard tenantId={tenantId} showToast={showToast} />}
                            {currentView === 'reservations' && <ReservationsView tenantId={tenantId} showToast={showToast} />}
                            {currentView === 'rooms' && <RoomsView tenantId={tenantId} showToast={showToast} />}
                            {currentView === 'ai_assistant' && <AIAssistantView showToast={showToast} />}
                        </main>

                        <nav className="md:hidden bg-white border-t border-gray-200 flex justify-around p-3 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)}
                                    className={`flex flex-col items-center p-2 rounded-lg ${currentView === item.id ? (item.id === 'ai_assistant' ? 'text-purple-600' : 'text-blue-600') : 'text-gray-500'}`}>
                                    {item.icon}
                                    <span className="text-[10px] mt-1 font-medium">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </div>

                    <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: '' })} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
