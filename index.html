<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Gates Hotel PMS</title>
    
    <!-- 1. Import Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Import React & ReactDOM (Versi 18) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Import Babel untuk membaca sintaks JSX React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 4. Import Supabase JS (V2) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom Style tambahan untuk tampilan rapi -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <!-- Di sinilah aplikasi React kita akan dimuat -->
    <div id="root"></div>

    <!-- Script Utama Aplikasi -->
    <script type="text/babel">
        // ==========================================
        // 🛠️ 1. SETUP SUPABASE
        // ==========================================
        // Dapatkan URL dan KEY ini di Dashboard Supabase -> Project Settings -> API
        const SUPABASE_URL = 'https://wzammfnzptusiicwdaut.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Jk23sVPoYwengKLIjL78ww_Az4d7Tl-';
        
        // Cek apakah URL sudah diisi dengan benar (menghindari error "Invalid supabaseUrl")
        const isConfigured = SUPABASE_URL.startsWith('http');
        
        const supabase = isConfigured 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : {
                auth: {
                    getSession: async () => ({ data: { session: null } }),
                    onAuthStateChange: () => ({ data: { subscription: { unsubscribe: () => {} } } })
                }
              };

        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 🧩 2. KOMPONEN UI REUSABLE
        // ==========================================
        
        // Ikon Sederhana (SVG)
        const Icons = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Book: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
            Bed: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Logout: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        };

        // Komponen Notifikasi Toast
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [message]);

            if (!message) return null;
            const bg = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            return (
                <div className={`fixed top-5 right-5 ${bg} text-white px-6 py-3 rounded-lg shadow-lg flex items-center z-50 transition-all`}>
                    <span>{message}</span>
                </div>
            );
        };

        // ==========================================
        // 🔐 3. HALAMAN LOGIN
        // ==========================================
        const LoginScreen = ({ onLoginSuccess, showToast }) => {
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({ tenant_id: '', email: '', password: '' });

            // Hapus useEffect yang mengambil daftar tenant (hotel), karena sekarang pakai input manual

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    // 1. Coba Login dengan Supabase Auth
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: formData.email,
                        password: formData.password
                    });

                    if (error) throw error;

                    // 2. Verifikasi apakah user ini milik Hotel (Tenant) yang dipilih
                    const userTenantId = data.session.user.app_metadata?.tenant_id;
                    const role = data.session.user.app_metadata?.role;

                    // Super admin bisa masuk ke hotel mana saja
                    if (role !== 'super_admin' && userTenantId !== formData.tenant_id) {
                        // Jika bukan hotelnya, keluarkan lagi (Sign out)
                        await supabase.auth.signOut();
                        throw new Error("Akses ditolak. Kode Hotel atau Kredensial tidak sesuai.");
                    }

                    showToast("Login berhasil!", "success");
                    onLoginSuccess(data.session);

                } catch (error) {
                    showToast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-blue-600">New Gates PMS</h1>
                            <p className="text-gray-500 mt-2">Sistem Manajemen Hotel Front Office</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Kode Hotel</label>
                                <input 
                                    type="text" 
                                    className="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                    placeholder="Contoh: 00000000-0000-..."
                                    value={formData.tenant_id}
                                    onChange={(e) => setFormData({...formData, tenant_id: e.target.value.trim()})}
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email Karyawan</label>
                                <input type="email" required className="w-full border border-gray-300 p-3 rounded-lg"
                                    value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" required className="w-full border border-gray-300 p-3 rounded-lg"
                                    value={formData.password} onChange={(e) => setFormData({...formData, password: e.target.value})} />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
                                {loading ? 'Memeriksa...' : 'Masuk Sistem'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 📊 4. DASHBOARD COMPONENT
        // ==========================================
        const Dashboard = ({ tenantId, showToast }) => {
            const [stats, setStats] = useState({ rooms: 0, reservations: 0, revenue: 0 });

            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        // RLS akan otomatis membatasi data hanya untuk tenant ini!
                        const [resRooms, resBookings] = await Promise.all([
                            supabase.from('rooms').select('id', { count: 'exact' }),
                            supabase.from('reservations').select('total_amount')
                        ]);
                        
                        let totalRev = 0;
                        if(resBookings.data) {
                            totalRev = resBookings.data.reduce((sum, b) => sum + (Number(b.total_amount) || 0), 0);
                        }

                        setStats({
                            rooms: resRooms.count || 0,
                            reservations: resBookings.data?.length || 0,
                            revenue: totalRev
                        });
                    } catch (error) {
                        showToast("Gagal memuat statistik", "error");
                    }
                };
                if(tenantId) fetchStats();
            }, [tenantId]);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Ringkasan Hari Ini</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                            <p className="text-gray-500 text-sm">Total Kamar Terdaftar</p>
                            <p className="text-3xl font-bold text-gray-800">{stats.rooms}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                            <p className="text-gray-500 text-sm">Reservasi Aktif</p>
                            <p className="text-3xl font-bold text-gray-800">{stats.reservations}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-purple-500">
                            <p className="text-gray-500 text-sm">Estimasi Pendapatan</p>
                            <p className="text-3xl font-bold text-gray-800">Rp {stats.revenue.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🛏️ 5. HOUSEKEEPING / ROOMS COMPONENT
        // ==========================================
        const RoomsView = ({ tenantId, showToast }) => {
            const [rooms, setRooms] = useState([]);

            useEffect(() => {
                const fetchRooms = async () => {
                    const { data, error } = await supabase
                        .from('rooms')
                        .select(`*, room_types(name)`)
                        .order('room_number');
                    if (data) setRooms(data);
                    if (error) showToast("Gagal memuat kamar", "error");
                };
                fetchRooms();
            }, []);

            const getStatusColor = (status) => {
                switch(status) {
                    case 'available': return 'bg-green-100 text-green-800';
                    case 'occupied': return 'bg-red-100 text-red-800';
                    case 'dirty': return 'bg-yellow-100 text-yellow-800';
                    case 'maintenance': return 'bg-gray-100 text-gray-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Status Kamar (Housekeeping)</h2>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        {rooms.map(room => (
                            <div key={room.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center justify-center h-32 hover:shadow-md transition">
                                <span className="text-2xl font-bold text-gray-800">{room.room_number}</span>
                                <span className="text-xs text-gray-500 mt-1">{room.room_types?.name}</span>
                                <span className={`mt-2 px-3 py-1 rounded-full text-xs font-semibold uppercase ${getStatusColor(room.status)}`}>
                                    {room.status}
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 📝 6. RESERVASI COMPONENT (KOMPLEKS)
        // ==========================================
        const ReservationsView = ({ tenantId, showToast }) => {
            const [reservations, setReservations] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [loading, setLoading] = useState(false);
            
            // State untuk Form Reservasi yang sangat detail
            const [form, setForm] = useState({
                guest_name: '', phone: '', email: '', 
                check_in: '', check_out: '', room_type: '', room_number: '', 
                adult_count: 1, child_count: 0, segment: 'leisure', total_amount: 0
            });

            const fetchRes = async () => {
                const { data, error } = await supabase.from('reservations').select('*').order('created_at', { ascending: false });
                if (data) setReservations(data);
            };

            useEffect(() => { fetchRes(); }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    // Simpan data reservasi, RLS akan otomatis mengaitkan dengan tenant yang login
                    const { error } = await supabase.from('reservations').insert([{
                        tenant_id: tenantId,
                        reservation_number: 'RES-' + Math.floor(Math.random() * 100000),
                        guest_name: form.guest_name,
                        phone: form.phone,
                        email: form.email,
                        check_in: form.check_in,
                        check_out: form.check_out,
                        adult_count: form.adult_count,
                        segment: form.segment,
                        total_amount: form.total_amount,
                        status: 'confirmed'
                    }]);

                    if (error) throw error;
                    
                    showToast("Reservasi berhasil dibuat!", "success");
                    setIsModalOpen(false);
                    fetchRes(); // Refresh data
                } catch (error) {
                    showToast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Daftar Reservasi & Check-in</h2>
                        <button onClick={() => setIsModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                            <Icons.Plus /> Buat Reservasi Baru
                        </button>
                    </div>

                    {/* Tabel Daftar Reservasi */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-50 border-b border-gray-100">
                                    <th className="p-4 text-sm font-semibold text-gray-600">No. Res</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Nama Tamu</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Cek-in</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Cek-out</th>
                                    <th className="p-4 text-sm font-semibold text-gray-600">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {reservations.map(res => (
                                    <tr key={res.id} className="border-b border-gray-50 hover:bg-gray-50">
                                        <td className="p-4 font-mono text-sm">{res.reservation_number}</td>
                                        <td className="p-4 font-medium">{res.guest_name}</td>
                                        <td className="p-4 text-gray-600">{res.check_in}</td>
                                        <td className="p-4 text-gray-600">{res.check_out}</td>
                                        <td className="p-4">
                                            <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full uppercase font-semibold">
                                                {res.status}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                                {reservations.length === 0 && (
                                    <tr><td colSpan="5" className="p-8 text-center text-gray-500">Belum ada data reservasi.</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal Form Tambah Reservasi */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h3 className="text-xl font-bold text-gray-800">Form Front Office - Reservasi Baru</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                                </div>
                                <div className="p-6 overflow-y-auto hide-scroll flex-1">
                                    <form id="resForm" onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Kolom 1 */}
                                        <div className="space-y-4">
                                            <h4 className="font-semibold text-gray-700 border-b pb-2">Informasi Tamu</h4>
                                            <div><label className="block text-xs text-gray-500 mb-1">Nama Tamu *</label><input required className="w-full border p-2 rounded" type="text" onChange={e=>setForm({...form, guest_name: e.target.value})} /></div>
                                            <div><label className="block text-xs text-gray-500 mb-1">Nomor Telepon</label><input className="w-full border p-2 rounded" type="text" onChange={e=>setForm({...form, phone: e.target.value})} /></div>
                                            <div><label className="block text-xs text-gray-500 mb-1">Email</label><input className="w-full border p-2 rounded" type="email" onChange={e=>setForm({...form, email: e.target.value})} /></div>
                                            <div className="flex gap-4">
                                                <div className="flex-1"><label className="block text-xs text-gray-500 mb-1">Dewasa</label><input type="number" min="1" className="w-full border p-2 rounded" value={form.adult_count} onChange={e=>setForm({...form, adult_count: e.target.value})} /></div>
                                                <div className="flex-1"><label className="block text-xs text-gray-500 mb-1">Anak-anak</label><input type="number" min="0" className="w-full border p-2 rounded" value={form.child_count} onChange={e=>setForm({...form, child_count: e.target.value})} /></div>
                                            </div>
                                            <div><label className="block text-xs text-gray-500 mb-1">Segmentasi Pasar</label>
                                                <select className="w-full border p-2 rounded" onChange={e=>setForm({...form, segment: e.target.value})}>
                                                    <option value="leisure">Leisure</option><option value="corporate">Corporate</option>
                                                    <option value="ota">Online Travel Agent (OTA)</option><option value="walk_in">Walk-In</option>
                                                </select>
                                            </div>
                                        </div>
                                        {/* Kolom 2 */}
                                        <div className="space-y-4">
                                            <h4 className="font-semibold text-gray-700 border-b pb-2">Detail Kamar & Tanggal</h4>
                                            <div><label className="block text-xs text-gray-500 mb-1">Tanggal Check-In *</label><input required className="w-full border p-2 rounded" type="date" onChange={e=>setForm({...form, check_in: e.target.value})} /></div>
                                            <div><label className="block text-xs text-gray-500 mb-1">Tanggal Check-Out *</label><input required className="w-full border p-2 rounded" type="date" onChange={e=>setForm({...form, check_out: e.target.value})} /></div>
                                            <div><label className="block text-xs text-gray-500 mb-1">Total Harga / Rate (Rp)</label><input className="w-full border p-2 rounded" type="number" onChange={e=>setForm({...form, total_amount: e.target.value})} /></div>
                                            <div className="bg-blue-50 p-4 rounded-lg mt-6">
                                                <p className="text-sm text-blue-800">Pastikan identitas tamu dicatat saat check-in fisik di resepsionis. Invoice dan Folio akan otomatis terbuat setelah reservasi disimpan.</p>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                <div className="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl">
                                    <button onClick={() => setIsModalOpen(false)} type="button" className="px-5 py-2 text-gray-600 bg-white border rounded-lg hover:bg-gray-100">Batal</button>
                                    <button form="resForm" type="submit" disabled={loading} className="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                                        {loading ? 'Menyimpan...' : 'Simpan Reservasi'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        // ==========================================
        // 🏗️ 7. STRUKTUR UTAMA APLIKASI (APP)
        // ==========================================
        const App = () => {
            const [session, setSession] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState({ message: '', type: '' });

            const showToast = (message, type = 'success') => setToast({ message, type });

            // Cek apakah user sudah login sebelumnya
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setSession(null);
            };

            // Layar peringatan jika Supabase belum disetup
            if (!isConfigured) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border-t-4 border-yellow-500">
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">Setup Diperlukan 🛠️</h1>
                            <p className="text-gray-600 mb-6">Oops! Sepertinya kamu belum memasukkan URL dan API Key Supabase ke dalam kodemu.</p>
                            <div className="bg-gray-50 p-4 rounded-lg text-left text-sm text-gray-700 mb-6 font-mono border border-gray-200">
                                1. Buka kode <b>index.html</b><br/>
                                2. Cari baris <span className="text-blue-600 font-bold">SUPABASE_URL</span><br/>
                                3. Ganti dengan URL dari Dashboard Supabase milikmu
                            </div>
                            <p className="text-sm text-gray-500">Refresh halaman ini setelah kamu menyimpannya ya!</p>
                        </div>
                    </div>
                );
            }

            // Jika belum login, tampilkan layar login
            if (!session) {
                return <LoginScreen onLoginSuccess={setSession} showToast={showToast} />;
            }

            // Ambil ID Hotel dari data user yang login
            const tenantId = session.user.app_metadata?.tenant_id;

            // Navigasi Sidebar
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <Icons.Home /> },
                { id: 'reservations', label: 'Front Office', icon: <Icons.Book /> },
                { id: 'rooms', label: 'Housekeeping', icon: <Icons.Bed /> },
            ];

            return (
                <div className="flex h-screen bg-gray-100 font-sans">
                    {/* Sidebar Desktop */}
                    <div className="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 shadow-sm">
                        <div className="p-6 border-b border-gray-100">
                            <h1 className="text-xl font-bold text-blue-700">New Gates PMS</h1>
                            <p className="text-xs text-gray-500 mt-1 truncate">User: {session.user.email}</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${currentView === item.id ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    {item.icon} {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-100">
                            <button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                                <Icons.Logout /> Keluar
                            </button>
                        </div>
                    </div>

                    {/* Area Konten Utama */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="bg-white md:hidden p-4 border-b border-gray-200 flex justify-between items-center shadow-sm z-10">
                            <h1 className="text-lg font-bold text-blue-700">New Gates PMS</h1>
                            <button onClick={handleLogout} className="text-red-500"><Icons.Logout /></button>
                        </header>
                        
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {currentView === 'dashboard' && <Dashboard tenantId={tenantId} showToast={showToast} />}
                            {currentView === 'reservations' && <ReservationsView tenantId={tenantId} showToast={showToast} />}
                            {currentView === 'rooms' && <RoomsView tenantId={tenantId} showToast={showToast} />}
                        </main>

                        {/* Bottom Nav Mobile */}
                        <nav className="md:hidden bg-white border-t border-gray-200 flex justify-around p-3 pb-safe z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)}
                                    className={`flex flex-col items-center p-2 rounded-lg ${currentView === item.id ? 'text-blue-600' : 'text-gray-500'}`}>
                                    {item.icon}
                                    <span className="text-[10px] mt-1 font-medium">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </div>

                    <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: '' })} />
                </div>
            );
        };

        // Render Aplikasi React ke dalam div #root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
