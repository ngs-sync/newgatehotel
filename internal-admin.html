<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Super Admin - New Gates</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 🛠️ 1. SETUP SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://wzammfnzptusiicwdaut.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Jk23sVPoYwengKLIjL78ww_Az4d7Tl-';
        
        const isConfigured = SUPABASE_URL.startsWith('http');
        const supabase = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const { useState, useEffect } = React;

        // ==========================================
        // 🧩 2. KOMPONEN UI REUSABLE
        // ==========================================
        const Icons = {
            Building: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>,
            Copy: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Logout: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [message]);
            if (!message) return null;
            const bg = type === 'error' ? 'bg-red-500' : 'bg-gray-800';
            return (
                <div className={`fixed bottom-5 right-5 ${bg} text-white px-6 py-3 rounded-lg shadow-xl flex items-center z-50`}>
                    <span>{message}</span>
                </div>
            );
        };

        const copyToClipboard = (text, showToast) => {
            navigator.clipboard.writeText(text);
            showToast("Kode disalin!", "success");
        };

        // ==========================================
        // 🔐 3. HALAMAN LOGIN SUPER ADMIN (Sistem Manual Opsi C)
        // ==========================================
        const AdminLogin = ({ onLoginSuccess, showToast }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    // Cek ke tabel profiles buatan kita
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('email', email)
                        .eq('password', password)
                        .eq('role', 'super_admin')
                        .single();

                    if (error || !data) {
                        throw new Error("Kredensial salah atau Anda bukan Super Admin.");
                    }

                    showToast("Selamat datang, Super Admin!");
                    // Simpan data user ke localStorage (sebagai sesi sederhana)
                    localStorage.setItem('admin_session', JSON.stringify(data));
                    onLoginSuccess(data);
                } catch (error) {
                    showToast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-900 p-4">
                    <div className="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
                        <div className="text-center mb-8">
                            <div className="bg-blue-600 w-16 h-16 rounded-xl mx-auto flex items-center justify-center mb-4">
                                <Icons.Building className="w-8 h-8 text-white" />
                            </div>
                            <h1 className="text-2xl font-bold text-white">SaaS Control Center</h1>
                            <p className="text-gray-400 mt-2 text-sm">Login Super Admin</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1">Email Master</label>
                                <input type="email" required className="w-full bg-gray-700 border border-gray-600 text-white p-3 rounded-lg focus:ring-blue-500" placeholder="admin@newgates.com" value={email} onChange={(e) => setEmail(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1">Password</label>
                                <input type="password" required className="w-full bg-gray-700 border border-gray-600 text-white p-3 rounded-lg focus:ring-blue-500" placeholder="admin123" value={password} onChange={(e) => setPassword(e.target.value)} />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors mt-4">
                                {loading ? 'Memverifikasi...' : 'Akses Control Center'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🏨 4. MANAJEMEN KLIEN (FORM 2-IN-1 SAKTI)
        // ==========================================
        const TenantsManager = ({ showToast }) => {
            const [tenants, setTenants] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [loading, setLoading] = useState(false);
            
            // State form digabung untuk Hotel & Adminnya
            const [form, setForm] = useState({
                // Data Hotel
                tenant_id: '', name: '', plan: 'starter', is_active: true,
                // Data Hotel Admin
                admin_name: '', admin_email: '', admin_phone: '', admin_password: 'manual by super admin'
            });

            const fetchTenants = async () => {
                const { data, error } = await supabase.from('tenants').select('*').order('created_at', { ascending: false });
                if (data) setTenants(data);
            };

            useEffect(() => { fetchTenants(); }, []);

            const handleCreateClient = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    // 1. Simpan Data Hotel (Tenant)
                    const { error: errTenant } = await supabase.from('tenants').insert([{
                        id: form.tenant_id,
                        name: form.name,
                        plan: form.plan,
                        is_active: form.is_active
                    }]);
                    if (errTenant) throw new Error("Gagal membuat Hotel. Kode ID mungkin sudah dipakai.");

                    // 2. Simpan Data Akun Hotel Admin
                    const { error: errAdmin } = await supabase.from('profiles').insert([{
                        tenant_id: form.tenant_id,
                        email: form.admin_email,
                        password: form.admin_password,
                        role: 'hotel_admin',
                        full_name: form.admin_name,
                        phone: form.admin_phone
                    }]);
                    if (errAdmin) throw new Error("Hotel dibuat, tapi gagal membuat akun Admin: " + errAdmin.message);

                    showToast("Sukses! Hotel & Akun Admin berhasil dibuat.", "success");
                    setIsModalOpen(false);
                    // Reset form
                    setForm({
                        tenant_id: '', name: '', plan: 'starter', is_active: true,
                        admin_name: '', admin_email: '', admin_phone: '', admin_password: 'manual by super admin'
                    });
                    fetchTenants();
                } catch (err) {
                    showToast(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div>
                            <h2 className="text-xl font-bold text-gray-800">Manajemen Klien (Hotel)</h2>
                            <p className="text-sm text-gray-500">Daftar semua hotel yang menggunakan SaaS kamu.</p>
                        </div>
                        <button onClick={() => setIsModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-medium">
                            <Icons.Plus /> Registrasi Hotel Baru
                        </button>
                    </div>

                    {/* Tabel Daftar Hotel */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-50 border-b border-gray-200">
                                    <th className="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Nama Hotel</th>
                                    <th className="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Kode Hotel (ID)</th>
                                    <th className="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Paket SaaS</th>
                                    <th className="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {tenants.map(tenant => (
                                    <tr key={tenant.id} className="hover:bg-gray-50">
                                        <td className="p-4 font-medium text-gray-900">{tenant.name}</td>
                                        <td className="p-4">
                                            <div className="flex items-center gap-2">
                                                <code className="bg-gray-100 text-pink-600 px-2 py-1 rounded text-xs font-mono font-bold">{tenant.id}</code>
                                                <button onClick={() => copyToClipboard(tenant.id, showToast)} className="text-gray-400 hover:text-blue-600"><Icons.Copy /></button>
                                            </div>
                                        </td>
                                        <td className="p-4">
                                            <span className="px-2.5 py-1 rounded-full text-xs font-semibold uppercase bg-blue-100 text-blue-700">{tenant.plan}</span>
                                        </td>
                                        <td className="p-4">
                                            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${tenant.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                {tenant.is_active ? 'Aktif' : 'Suspend'}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal Tambah Klien & Admin (Form 2-in-1) */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center p-5 border-b border-gray-100">
                                    <h3 className="text-lg font-bold text-gray-800">Setup Klien & Admin Baru</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                                </div>
                                
                                <div className="p-6 overflow-y-auto hide-scroll flex-1">
                                    <form id="setupForm" onSubmit={handleCreateClient} className="space-y-6">
                                        
                                        {/* Bagian 1: Data Hotel */}
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                            <h4 className="flex items-center gap-2 font-bold text-blue-800 border-b border-blue-200 pb-2 mb-4">
                                                <Icons.Building /> 1. Detail Hotel / Properti
                                            </h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Kode Hotel Manual *</label>
                                                    <input required type="text" className="w-full border p-2.5 rounded-lg uppercase" placeholder="Cth: GATES-001" 
                                                        value={form.tenant_id} onChange={e=>setForm({...form, tenant_id: e.target.value.toUpperCase()})} />
                                                    <p className="text-[10px] text-gray-500 mt-1">Kode ini akan dipakai resepsionis saat login.</p>
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama / Merk Hotel *</label>
                                                    <input required type="text" className="w-full border p-2.5 rounded-lg" placeholder="Cth: Grand Vibe Hotel" 
                                                        value={form.name} onChange={e=>setForm({...form, name: e.target.value})} />
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Paket Langganan</label>
                                                    <select className="w-full border p-2.5 rounded-lg" value={form.plan} onChange={e=>setForm({...form, plan: e.target.value})}>
                                                        <option value="starter">Starter (Maks 20 Kamar)</option>
                                                        <option value="pro">Pro (Maks 100 Kamar)</option>
                                                        <option value="enterprise">Enterprise (Unlimited)</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Bagian 2: Data Akun Admin */}
                                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                                            <h4 className="flex items-center gap-2 font-bold text-purple-800 border-b border-purple-200 pb-2 mb-4">
                                                <Icons.User /> 2. Buat Akun Manager / Hotel Admin
                                            </h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
                                                    <input required type="text" className="w-full border p-2.5 rounded-lg" placeholder="Cth: Budi Santoso" 
                                                        value={form.admin_name} onChange={e=>setForm({...form, admin_name: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">No. Telepon / WhatsApp</label>
                                                    <input type="text" className="w-full border p-2.5 rounded-lg" placeholder="0812xxxxxx" 
                                                        value={form.admin_phone} onChange={e=>setForm({...form, admin_phone: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email (Untuk Login) *</label>
                                                    <input required type="email" className="w-full border p-2.5 rounded-lg" placeholder="budi@hotel.com" 
                                                        value={form.admin_email} onChange={e=>setForm({...form, admin_email: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password Default</label>
                                                    <input type="text" className="w-full border p-2.5 rounded-lg bg-gray-100 text-gray-600" 
                                                        value={form.admin_password} onChange={e=>setForm({...form, admin_password: e.target.value})} />
                                                    <p className="text-[10px] text-gray-500 mt-1">Kamu bisa ubah atau biarkan default.</p>
                                                </div>
                                            </div>
                                        </div>

                                    </form>
                                </div>
                                <div className="p-5 border-t border-gray-100 flex gap-3 bg-gray-50 rounded-b-2xl">
                                    <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 px-4 py-3 text-gray-600 bg-white border border-gray-300 rounded-xl font-medium">Batal</button>
                                    <button form="setupForm" type="submit" disabled={loading} className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-500/30">
                                        {loading ? 'Menyimpan...' : 'Buat Hotel & Admin'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 🏗️ 5. APP UTAMA (ADMIN)
        // ==========================================
        const AppAdmin = () => {
            const [session, setSession] = useState(null);
            const [toast, setToast] = useState({ message: '', type: '' });
            const showToast = (message, type = 'success') => setToast({ message, type });

            // Cek localStorage saat pertama kali dimuat
            useEffect(() => {
                const savedSession = localStorage.getItem('admin_session');
                if (savedSession) setSession(JSON.parse(savedSession));
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('admin_session');
                setSession(null);
            };

            if (!isConfigured) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-900">
                        <div className="bg-gray-800 p-8 rounded-xl text-center">
                            <h1 className="text-white text-xl font-bold">Setup Diperlukan</h1>
                            <p className="text-gray-400">Masukkan URL dan API Key Supabase.</p>
                        </div>
                    </div>
                );
            }

            if (!session) return <AdminLogin onLoginSuccess={setSession} showToast={showToast} />;

            return (
                <div className="flex h-screen bg-gray-100 font-sans">
                    <div className="w-64 bg-gray-900 text-gray-300 flex flex-col shadow-2xl z-20">
                        <div className="p-6 border-b border-gray-800">
                            <h1 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Building/> New Gates</h1>
                            <p className="text-xs text-gray-500 uppercase tracking-widest mt-1">{session.full_name}</p>
                        </div>
                        <nav className="flex-1 p-4">
                            <button className="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-lg shadow-blue-900/20">
                                <Icons.Building /> Klien / Hotel
                            </button>
                        </nav>
                        <div className="p-4 border-t border-gray-800">
                            <button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-gray-800 rounded-xl transition-colors">
                                <Icons.Logout /> Keluar Admin
                            </button>
                        </div>
                    </div>
                    <main className="flex-1 overflow-y-auto p-8 bg-[#f8fafc]">
                        <TenantsManager showToast={showToast} />
                    </main>
                    <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: '' })} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppAdmin />);
    </script>
</body>
</html>
